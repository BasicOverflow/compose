# Glance Configuration
# This is the main configuration file for your dashboard

# Server configuration
server:
  host: 0.0.0.0
  port: 8080

# Environment variables
env:
  DOCKER_HOST: "unix:///var/run/docker.sock"

# Theme configuration - Obsidian-inspired dark theme
theme:
  background-color: 0 0 8
  primary-color: 220 13 91
  positive-color: 135 94 66
  negative-color: 0 100 67
  contrast-multiplier: 1.2
  presets:
    obsidian-purple:
      background-color: 0 0 8
      primary-color: 265 89 79
      positive-color: 135 94 66
      negative-color: 0 100 67
      contrast-multiplier: 1.2

# Pages configuration
# Monitor notes: Glance checks many sites concurrently (worker pool).
# Use cache >= 2m, timeout >= 10s, and check-url to cheap health endpoints
# so heavy SPAs / TLS do not false-timeout under parallel load.
pages:
  - name: Homelab
    columns:
      - size: small
        widgets:
          # Public Apps
          - type: monitor
            size: small
            title: "Public Apps"
            cache: 2m
            sites:
              - title: "Immich"
                url: "https://immich.basicoverflow.com"
                timeout: 10s
              - title: "Vault-Warden"
                url: "https://vault.basicoverflow.com"
                timeout: 10s
              - title: "Jellyfin"
                url: "http://jellyfin.basicoverflow.com"
                timeout: 10s
              - title: "Seer"
                url: "http://jellyseer.basicoverflow.com"
                timeout: 10s

          # Filebrowser
          - type: monitor
            size: small
            title: "Filebrowser"
            cache: 2m
            sites:
              - title: "NAS Filebrowser"
                url: "http://10.0.220.145:8080"
                timeout: 10s
              - title: "Misc Host Filebrowser"
                url: "http://10.0.2.247:8080/"
                timeout: 10s
              - title: "Minecraft Host Filebrowser"
                url: "http://10.0.0.155:8080"
                timeout: 10s

          # External Services (links only — no reachability checks)
          - type: bookmarks
            size: small
            title: "External Services"
            groups:
              - links:
                  - title: "Cloudflare Dashboard"
                    url: "https://dash.cloudflare.com"
                  - title: "Squarespace"
                    url: "https://login.squarespace.com/"
                  - title: "Homelab Github"
                    url: "https://github.com/BasicOverflow/compose"
                  - title: "UniFi Gateway Console"
                    url: "https://unifi.ui.com/"

      - size: full
        widgets:
          # Main Infrastructure
          - type: monitor
            size: small
            title: "Main Infrastructure & Networking"
            cache: 2m
            sites:
              - title: "Proxmox Aitherios"
                url: "https://10.0.0.225:8006"
                timeout: 10s
                allow-insecure: true
              - title: "Proxmox Sterianos"
                url: "https://10.0.0.10:8006"
                timeout: 10s
                allow-insecure: true
              - title: "Proxmox Phidios"
                url: "https://10.0.0.154:8006"
                timeout: 10s
                allow-insecure: true
              - title: "Proxmox Home-Media"
                url: "https://10.0.0.20:8006"
                timeout: 10s
                allow-insecure: true
              - title: "Nginx Proxy Manager"
                url: "http://10.0.0.136:81"
                timeout: 10s
              - title: "Portainer Master"
                url: "http://10.0.9.28:9000"
                timeout: 10s
              - title: "Portainer NAS"
                url: "https://10.0.220.145:31015"
                timeout: 10s
                allow-insecure: true
              - title: "Semaphore"
