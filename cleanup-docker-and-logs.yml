---
- name: Cleanup Docker and System Logs
  hosts: docker-vms
  become: yes

  tasks:
    # Do NOT prune containers. Stopped app containers (e.g. metube after a crash)
    # would be deleted and never come back until manually redeployed — this was
    # wiping MeTube within ~1 week of each patch (playbook runs weekly).
    - name: Prune unused Docker volumes
      shell: docker volume prune -af
      async: 600
      poll: 10
      changed_when: false
      ignore_errors: yes

    - name: Prune dangling Docker images only
      shell: docker image prune -f
      async: 600
      poll: 10
      changed_when: false
      ignore_errors: yes

    - name: Prune Docker build cache
      shell: docker builder prune -af
      async: 600
      poll: 10
      changed_when: false
      ignore_errors: yes

    # Truncate only — deleting log inodes under /var/lib/docker/containers can
    # confuse the daemon; truncation keeps the files Docker has open.
    - name: Truncate Docker container log files
      shell: |
        truncate -s 0 /var/lib/docker/containers/*/*-json.log 2>/dev/null || true
      changed_when: false
      ignore_errors: yes

    - name: Clean up systemd journal logs (keep last 7 days)
      shell: journalctl --vacuum-time=7d
      async: 600
      poll: 10
      changed_when: false
      ignore_errors: yes

    - name: Clean up old systemd journal files
      shell: |
        find /var/log/journal -name "*.journal" -mtime +7 -delete 2>/dev/null || true
        find /var/log/journal -name "*.journal~" -delete 2>/dev/null || true
      changed_when: false
      ignore_errors: yes

    - name: Clean up /tmp directory (files older than 7 days)
      shell: |
        find /tmp -type f -atime +7 -delete 2>/dev/null || true
        find /tmp -type d -empty -delete 2>/dev/null || true
      changed_when: false
      ignore_errors: yes

    - name: Clean up /var/tmp directory (files older than 7 days)
      shell: |
        find /var/tmp -type f -atime +7 -delete 2>/dev/null || true
        find /var/tmp -type d -empty -delete 2>/dev/null || true
      changed_when: false
      ignore_errors: yes

    - name: Clean up old log files in /var/log
      shell: |
        find /var/log -name "*.log" -type f -mtime +30 -delete 2>/dev/null || true
        find /var/log -name "*.gz" -type f -mtime +30 -delete 2>/dev/null || true
        find /var/log -name "*.old" -type f -mtime +30 -delete 2>/dev/null || true
      async: 600
      poll: 10
      changed_when: false
      ignore_errors: yes

    - name: Clean up core dumps
      shell: |
        find /var/crash -type f -delete 2>/dev/null || true
        find / -name "core.*" -type f -mtime +7 -delete 2>/dev/null || true
      async: 600
      poll: 10
      changed_when: false
      ignore_errors: yes

    - name: Clean up package manager cache
      shell: |
        apt-get clean
        apt-get autoclean
      changed_when: false
      ignore_errors: yes

    # After cleanup, recreate any exited jellyfin-stack services (path only exists
    # on jellyfin-host). restart:unless-stopped covers crashes; this covers the
    # case where a container was removed or left created-but-exited.
    - name: Ensure jellyfin-stack services are up when compose file exists
      shell: |
        if [ -f /home/peter/jellyfin-stack/docker-compose.yml ]; then
          docker compose -p jellyfin-stack -f /home/peter/jellyfin-stack/docker-compose.yml up -d
        fi
      changed_when: false
      ignore_errors: yes
